  <rect x="12" y="13" width="11" height="38" rx="4" fill="#fff"/>
  <rect x="15" y="17" width="5" height="5" rx="1.5" fill="#3b5bdb"/>
  <rect x="15" y="25" width="5" height="5" rx="1.5" fill="#3b5bdb"/>
  <rect x="15" y="33" width="5" height="5" rx="1.5" fill="#3b5bdb"/>
  <rect x="28" y="18" width="18" height="4" rx="2" fill="#fff"/>
  <rect x="28" y="27" width="24" height="4" rx="2" fill="#fff"/>
  <rect x="28" y="36" width="14" height="4" rx="2" fill="#fff"/>
</svg>
